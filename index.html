<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="./style.css">
  <title>Results summary component</title>

  
</head>
<body>
<div class="results-card">
  <!-- RESULTS PANEL -->
   <div class="result-panel">
    <h2>Your Result</h2>
    <div class="score-circle">
      <div class="total-score"> 76</div>
      <div score-total>of 100</div>
    </div>
    <h1>Great</h1>
    <p class="result-message">You scored higher than 65% of <br> the people who have taken <br>these tests.</p>
   </div>
   <!-- SUMMARY PANEL -->
    <div class="summary-panel">
      <h2>Summary</h2>
      <div class="summary-list">
        <div class="summary-item reaction">
          <div class="category">
            <div class="category-icon">
              <img src="./assets/images/icon-reaction.svg" alt="">
            </div>
            <div>Reaction</div>
          </div>
          <p><strong>80</strong>
          <div>/ 100</div></p>
          </div>
          <div class="summary-item memory">
            <div class="category">
              <div category-icon>
                <img src="./assets/images/icon-memory.svg" alt="">
              </div>
              <div> Memory</div>
            </div>
            <p><strong>92</strong>
            <div>/ 100</div></p>
          </div>

          <div class="summary-item verbal">
            <div class="category">
              <div class="category-icon">
                <img src="./assets/images/icon-verbal.svg" alt="">
              </div>
              <div>Verbal</div>
            </div>
            <p><strong> 61</strong>
            <div>/ 100</div></p>
          </div>
          
          <div class="summary-item visual">
            <div class="category">
              <div class="category-icon">
                <img src="./assets/images/icon-visual.svg" alt="">
              </div>
              <div>Visual</div>
            </div>
            <p><strong> 72</strong> 
            <div>/ 100</div></p>
          </div>
          </div>

          <button class="continue-btn"> Continue</button>
    </div>
</div>

  </footer> -->
</body>
</html>
